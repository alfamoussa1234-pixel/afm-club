<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFM — Gestion du club</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#1e1882;--pri-d:#13105a;--pri-dd:#0d0b40;--pri-l:#ebeafa;--sky:#9fd3f0;
  --gold:#c9a40e;--gold-d:#8f7400;--gold-l:#fbf4d6;
  --ok:#1f8a4c;--ok-l:#e5f4eb;--red:#c0392b;--red-l:#fbeaea;--blue:#2563a8;--blue-l:#e8f0fa;
  --bg:#f4f5f9;--card:#fff;--ink:#151632;--muted:#626580;--line:#e2e4ee;
  --r:12px;--sh:0 1px 2px rgba(10,10,60,.05),0 4px 14px rgba(10,10,60,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
/* Sidebar */
.side{background:linear-gradient(180deg,var(--pri-d),var(--pri-dd));color:#dcdcf3;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;border-right:3px solid var(--gold)}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 8px 18px;text-align:center}
.brand img{width:92px;height:auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.brand b{font-family:"Barlow Condensed";font-size:18px;color:#fff;line-height:1.1;letter-spacing:.06em;text-transform:uppercase}
.brand small{color:var(--sky);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#cfd0ee;text-decoration:none;font-weight:500;position:relative}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:var(--gold);color:var(--pri-dd);font-weight:700}
.nav .sep{height:1px;background:rgba(255,255,255,.1);margin:8px 6px}
.badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;line-height:1.5}
.nav a.on .badge{background:var(--pri-dd);color:#fff}
.side .foot{margin-top:auto;font-size:11px;color:#9a9cc8;padding:8px;display:flex;flex-direction:column;gap:8px}
.side .foot .btn{justify-content:center}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#9a9cc8;margin-right:6px;vertical-align:1px}
.dot.ok{background:#4ade80}.dot.local{background:var(--gold)}
/* Main */
main{padding:22px 32px 60px;min-width:0}
.bar-top{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:6px}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.me img{width:28px;height:28px;border-radius:50%}
.bell{position:relative;border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
.bell svg{width:19px;height:19px}
.bell .badge{position:absolute;top:-6px;right:-6px;margin:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{margin:0;font-size:34px;line-height:1}
.top p{margin:4px 0 0;color:var(--muted)}
.btn{border:0;background:var(--pri);color:#fff;padding:9px 15px;border-radius:9px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--pri-d)}
.btn.gold{background:var(--gold);color:var(--pri-dd)}
.btn.gold:hover{background:#b8960c}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#eceef6}
.btn.ghost-w{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18)}
.btn.ok{background:var(--ok)}.btn.danger{background:var(--red)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:7px;color:var(--muted)}
.icon-btn:hover{background:#eceef6;color:var(--ink)}
.icon-btn svg{width:16px;height:16px;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{margin:0 0 12px;font-size:20px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.two{grid-template-columns:1.4fr 1fr}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi .lab{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi .val{font-family:"Barlow Condensed";font-size:38px;font-weight:700;line-height:1.1;margin-top:4px}
.kpi .sub{color:var(--muted);font-size:12.5px}
.kpi.accent{background:var(--pri);color:#fff;border-color:var(--pri)}
.kpi.accent .lab,.kpi.accent .sub{color:#c3c3ee}
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.input,select.input,textarea.input{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;outline:none;min-width:0;width:100%}
.input:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.search{flex:1;min-width:180px;max-width:320px}
.seg{display:inline-flex;background:#e7e9f2;border-radius:9px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#fafbfd}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .act{text-align:right;white-space:nowrap;width:1%}
.wrap{overflow-x:auto;padding:0}
.jersey{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--pri);color:#fff;font-family:"Barlow Condensed";font-weight:700;font-size:17px;flex:none}
.who{display:flex;align-items:center;gap:10px}
.who b{display:block}
.who small{color:var(--muted)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.t-green{background:var(--ok-l);color:var(--ok)}
.t-gold{background:var(--gold-l);color:var(--gold-d)}
.t-red{background:var(--red-l);color:var(--red)}
.t-blue{background:var(--blue-l);color:var(--blue)}
.t-pri{background:var(--pri-l);color:var(--pri)}
.t-grey{background:#eceef3;color:#5a5d70}
.res{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-weight:700;font-size:12px;color:#fff}
.res.V{background:var(--ok)}.res.N{background:#8b8ea3}.res.D{background:var(--red)}
.form-strip{display:flex;gap:5px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty svg{width:38px;height:38px;opacity:.35;margin-bottom:6px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.muted{color:var(--muted)}
.score{font-family:"Barlow Condensed";font-weight:700;font-size:22px;white-space:nowrap}
.next{background:linear-gradient(135deg,var(--pri) 0%,var(--pri-dd) 100%);color:#fff;border:0;position:relative;overflow:hidden}
.next h3{color:#fff}
.next .vs{display:flex;align-items:center;justify-content:space-around;gap:10px;margin:8px 0 12px;text-align:center}
.next .team{font-family:"Barlow Condensed";font-size:24px;font-weight:700}
.next .vsb{font-family:"Barlow Condensed";font-size:18px;background:var(--gold);color:var(--pri-dd);border-radius:8px;padding:2px 10px}
.next .meta{color:#c3c3ee;text-align:center;font-size:13px}
.next::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border:18px solid rgba(255,255,255,.05);border-radius:50%}
.bar{height:8px;background:#e7e9f2;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.money-in{color:var(--ok);font-weight:600}
.money-out{color:var(--red);font-weight:600}
/* annonces */
.ann{border-left:4px solid var(--pri);padding:14px 16px;background:#fff;border-radius:10px;border:1px solid var(--line);border-left-width:4px;margin-bottom:10px}
.ann.Important{border-left-color:var(--gold)}
.ann.Urgent{border-left-color:var(--red)}
.ann h4{margin:0 0 4px;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ann p{margin:6px 0 0;white-space:pre-wrap}
.ann .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
/* demandes */
.req{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.req:last-child{border-bottom:0}
.req .reason{margin-top:6px;background:#f6f7fb;border-radius:8px;padding:8px 10px;font-size:13px;white-space:pre-wrap}
.req .reply{margin-top:6px;font-size:13px;color:var(--muted)}
.req .acts{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
/* notifications */
.np{position:fixed;top:70px;right:24px;width:min(380px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(10,10,60,.2);z-index:45;display:none}
.np.open{display:block}
.np header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.np header b{font-family:"Barlow Condensed";font-size:20px}
.ni{display:flex;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;color:inherit}
.ni:hover{background:#f8f9fc}
.ni.new{background:#f6f6ff}
.ni .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.ni .ic svg{width:16px;height:16px}
.ni small{color:var(--muted);display:block}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,10,50,.45);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow-y:auto}
.ov.open{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-size:24px}
.modal .body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.modal .full{grid-column:1/-1}
.modal label,.flabel{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:#3d3f58}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:8px}
.checks label{flex-direction:row;align-items:center;gap:7px;font-weight:500;padding:4px 6px;border-radius:6px;cursor:pointer}
.checks label:hover{background:var(--pri-l)}
.checks input{width:auto}
.scorer-row{display:flex;gap:8px;margin-bottom:6px}
.scorer-row select{flex:1}
.scorer-row input{width:70px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;z-index:60;pointer-events:none;font-weight:500}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{background:var(--gold-l);border:1px solid #ecd98a;color:#5e4c00;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill-stats{display:flex;gap:22px;flex-wrap:wrap}
.pill-stats div{display:flex;flex-direction:column}
.pill-stats b{font-family:"Barlow Condensed";font-size:28px;line-height:1}
.pill-stats span{font-size:12px;color:var(--muted)}
.hero{display:flex;align-items:center;gap:18px;background:linear-gradient(120deg,var(--pri-d),var(--pri) 70%);color:#fff;border-radius:14px;padding:20px 22px;margin-bottom:16px;border-bottom:4px solid var(--gold)}
.hero img{width:64px}
.hero h1{margin:0;font-size:30px;line-height:1}
.hero p{margin:4px 0 0;color:#c3c3ee}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:12px}
.pick button{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;text-align:left}
.pick button:hover{border-color:var(--pri);background:var(--pri-l)}
.login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 30% 20%,var(--pri),var(--pri-dd) 70%);z-index:30}
.lcard{background:#fff;border-radius:16px;padding:28px 26px;width:100%;max-width:380px;box-shadow:0 30px 80px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px;text-align:center;border-top:5px solid var(--gold)}
.lcard img{width:110px;margin:-4px auto 0}
.lcard h1{margin:0;font-size:26px}
.lcard label{text-align:left}
.lerr{color:var(--red);font-size:13px;min-height:18px}
.me{cursor:pointer;border-radius:10px;padding:4px 8px}
.me:hover{background:#eceef6}
.mob-top{display:none}
.show-m{display:none}
@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .two,.three{grid-template-columns:1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:5px 4px;z-index:40;border-right:0;border-top:3px solid var(--gold)}
  .brand,.side .foot,.nav .sep{display:none}
  .nav{flex-direction:row;width:100%;overflow-x:auto;gap:2px;scrollbar-width:none}
  .nav a{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 8px;flex:1 0 auto;min-width:64px;text-align:center;align-items:center}
  .nav a span{white-space:nowrap}
  .nav .badge{position:absolute;top:0;right:6px;font-size:9.5px;padding:0 5px}
  main{padding:12px 14px 96px}
  .mob-top{display:flex;align-items:center;gap:10px}
  .mob-top img{width:34px}
  .mob-top b{font-family:"Barlow Condensed";font-size:22px}
  .bar-top{justify-content:space-between;margin-bottom:12px}
  .me span{display:none}
  .top h1{font-size:28px}
  .modal .body{grid-template-columns:1fr}
  .hide-m{display:none}
  .show-m{display:inline}
  .grid.kpi3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .kpi3 .card{padding:12px}
  .kpi3 .val{font-size:30px}
  .kpi3 .lab{font-size:10.5px}
  .toast{bottom:88px}
  .np{top:62px;right:12px}
  .hero{padding:16px}
  .hero img{width:48px}
  .hero h1{font-size:24px}
}
</style>
</head>
<body>
<div class="login" id="login">
  <form class="lcard" onsubmit="event.preventDefault();doLogin(this)">
    <img src="logo.png" alt="Logo AFM">
    <h1>Afrique Football Management</h1>
    <p class="muted" style="margin:0 0 18px">Connectez-vous à l'espace du club</p>
    <label class="flabel">Identifiant<input class="input" id="lUser" name="username" autocomplete="username" required></label>
    <label class="flabel">Mot de passe<input class="input" type="password" name="password" autocomplete="current-password" required></label>
    <div id="loginErr" class="lerr"></div>
    <button class="btn" style="width:100%;justify-content:center;padding:11px">Se connecter</button>
    <p class="muted" style="font-size:12px;margin:14px 0 0">Pas encore de compte ? Demandez vos identifiants à l'administration du club.</p>
  </form>
</div>
<div class="app" style="display:none">
  <aside class="side">
    <div class="brand">
      <img src="logo.png" alt="Logo AFM">
      <b id="clubName">AFM</b><small>Afrique Football Management</small>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="sideFoot"></div>
  </aside>
  <main>
    <div class="bar-top">
      <div class="mob-top"><img src="logo.png" alt=""><b id="clubNameM">AFM</b></div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="me" id="meBox"></div>
        <button class="bell" id="bell" title="Notifications" onclick="toggleNotif()"></button>
      </div>
    </div>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
</div>
<div class="np" id="np"></div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= Utilitaires ================= */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const nowIso = () => new Date().toISOString();
const fmtDate = d => { if (!d) return "—"; const x = new Date(d.length <= 10 ? d + "T00:00:00" : d); return isNaN(x) ? d : x.toLocaleDateString("fr-FR", {day:"2-digit", month:"short", year:"numeric"}); };
const fmtDay = d => { if (!d) return ""; const x = new Date(d + "T00:00:00"); return isNaN(x) ? d : x.toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"}); };
const ago = iso => { const s = (Date.now() - new Date(iso)) / 1000; if (isNaN(s)) return ""; if (s < 60) return "à l'instant"; if (s < 3600) return "il y a " + Math.floor(s / 60) + " min"; if (s < 86400) return "il y a " + Math.floor(s / 3600) + " h"; if (s < 604800) return "il y a " + Math.floor(s / 86400) + " j"; return fmtDate(iso); };
const money = n => (Number(n) || 0).toLocaleString("fr-FR") + " " + (S.settings.devise || "FCFA");
const age = d => { if (!d) return ""; const b = new Date(d), n = new Date(); let a = n.getFullYear() - b.getFullYear(); if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--; return isNaN(a) ? "" : a; };
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2400); };

const I = {
  dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-7 7-7s7 3 7 7"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-1.7-5.4-4-6.4"/></svg>',
  ball:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m12 7 4 3-1.5 4.5h-5L8 10z"/><path d="M12 3v4M16 10l4.5-1.5M14.5 14.5l2.5 4M9.5 14.5 7 18.5M8 10 3.5 8.5"/></svg>',
  cone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3h4l5 16H5z"/><path d="M3 21h18M8 12h8M7 16h10"/></svg>',
  cash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/></svg>',

/* ================= État & stockage (API du serveur) ================= */
const COLS = ["players", "matches", "trainings", "finances", "annonces", "decisions"];
const S = { players: [], matches: [], trainings: [], finances: [], annonces: [], decisions: [], comptes: [], users: [],
  settings: { nom: "AFM", saison: "2026-2027", stade: "", devise: "FCFA", cotisation: 0 } };
let ME = null, MODE = "loading", canWrite = true, LOADED = false;
let IS_ADMIN = false, MY_ID = null, PREVIEW = false, PREVIEW_COMPTE = { id: "apercu", playerId: "", demandes: [] };
const isAdminView = () => IS_ADMIN && !PREVIEW;
const lsGet = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

async function api(method, url, body) {
  const r = await fetch("/api/" + url, { method, credentials: "same-origin", headers: { "Content-Type": "application/json", "X-AFM": "1" }, body: body === undefined ? undefined : JSON.stringify(body) });
  let data = {}; try { data = await r.json(); } catch (e) {}
  if (r.status === 401 && url !== "login") { ME = null; showLogin(); }
  if (!r.ok) throw Object.assign(new Error(data.error || "Erreur " + r.status), { status: r.status });
  return data;
}
const apiErr = e => toast(e && e.message && e.status ? e.message : "Connexion au serveur impossible, réessayez");

async function saveItem(col, obj) {
  const arr = S[col]; const i = arr.findIndex(x => x.id === obj.id);
  if (i >= 0) arr[i] = obj; else arr.push(obj);
  render();
  try { await api("PUT", `data/${col}/${obj.id}`, obj); bumpVersion(); } catch (e) { apiErr(e); refresh(); }
}
async function removeItem(col, id) {
  S[col] = S[col].filter(x => x.id !== id); render();
  try { await api("DELETE", `data/${col}/${id}`); bumpVersion(); } catch (e) { apiErr(e); refresh(); }
}
async function saveSettings(obj) {
  S.settings = { ...S.settings, ...obj }; render();
  try { await api("PUT", "settings", S.settings); bumpVersion(); } catch (e) { apiErr(e); refresh(); }
}
/* Demandes d'absence du joueur connecté */
const myCompte = () => PREVIEW ? PREVIEW_COMPTE : (S.comptes.find(c => c.id === MY_ID) || { id: MY_ID, playerId: ME ? ME.playerId : "", demandes: [] });
async function saveCompte(c) {
  if (PREVIEW) { PREVIEW_COMPTE = { ...c }; render(); return; }
  c = { ...c, id: MY_ID };
  const i = S.comptes.findIndex(x => x.id === MY_ID); if (i >= 0) S.comptes[i] = c; else S.comptes.push(c);
  render();
  try { await api("PUT", "mes-demandes", { demandes: c.demandes || [] }); bumpVersion(); } catch (e) { apiErr(e); refresh(); }
}

/* Chargement et synchronisation (vérifie les nouveautés toutes les 15 s) */
let VERSION = null, polling = null;
function applyState(d) {
  ME = d.user; IS_ADMIN = ME.role === "admin"; MY_ID = ME.id; canWrite = IS_ADMIN;
  COLS.forEach(c => S[c] = d[c] || []);
  S.comptes = d.comptes || []; S.users = d.users || [];
  if (d.settings) S.settings = { ...S.settings, ...d.settings };
  LOADED = true;
}
async function refresh() {
  try { const d = await api("GET", "state"); applyState(d); setSync("ok", "Synchronisé"); render(); }
  catch (e) { if (e.status !== 401) setSync("err", "Hors ligne — nouvelle tentative…"); }
}
async function bumpVersion() { try { VERSION = (await api("GET", "version")).v; } catch (e) {} }
async function poll() {
  if (!ME || document.hidden) return;
  try { const v = (await api("GET", "version")).v; if (v !== VERSION) { VERSION = v; await refresh(); } else if (MODE !== "ok") setSync("ok", "Synchronisé"); }
  catch (e) { if (e.status !== 401) setSync("err", "Hors ligne — nouvelle tentative…"); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
function setSync(mode, txt) { MODE = mode; SYNC = txt; if (ME) renderChrome(); }
let SYNC = "Connexion…";

async function initStore() {
  try { const d = await api("GET", "state"); applyState(d); VERSION = (await api("GET", "version")).v; afterLogin(); }
  catch (e) { if (e.status !== 401) { $("#view").innerHTML = `<div class="card">${empty("Le serveur ne répond pas. Patientez quelques secondes puis rechargez la page (le serveur gratuit met jusqu'à une minute à se réveiller).", "gear")}</div>`; } }
}
function afterLogin() {
  $("#login").style.display = "none"; document.querySelector(".app").style.display = "";
  setSync("ok", "Synchronisé");
  if (!IS_ADMIN && !PLAYER_ROUTES.some(r => r.id === location.hash.slice(1))) location.hash = "accueil";
  if (IS_ADMIN && !ADMIN_ROUTES.some(r => r.id === location.hash.slice(1))) location.hash = "tableau";
  clearInterval(polling); polling = setInterval(poll, 15000);
  render();
}
/* Écran de connexion */
function showLogin() {
  clearInterval(polling); document.querySelector(".app").style.display = "none"; closeModal();
  $("#login").style.display = "flex"; $("#loginErr").textContent = "";
  setTimeout(() => { const u = $("#lUser"); if (u) u.focus(); }, 30);
}
async function doLogin(f) {
  const btn = f.querySelector("button"); btn.disabled = true; $("#loginErr").textContent = "";
  try { await api("POST", "login", { username: f.username.value, password: f.password.value }); f.password.value = ""; await initStore(); }
  catch (e) { $("#loginErr").textContent = e.status ? e.message : "Serveur injoignable, réessayez."; }
  btn.disabled = false;
}
async function logout() { try { await api("POST", "logout"); } catch (e) {} ME = null; PREVIEW = false; LOADED = false; COLS.forEach(c => S[c] = []); S.comptes = []; S.users = []; showLogin(); }

/* ================= Calculs ================= */
const pById = id => S.players.find(x => x.id === id);
const pName = id => { const p = pById(id); return p ? `${p.prenom} ${p.nom}` : "Joueur inconnu"; };
const isPlayed = m => m.butsPour !== "" && m.butsPour != null && m.butsContre !== "" && m.butsContre != null;
const played = () => S.matches.filter(isPlayed);
const result = m => { const a = +m.butsPour, b = +m.butsContre; return a > b ? "V" : a < b ? "D" : "N"; };
function bilan() { const r = { J: 0, V: 0, N: 0, D: 0, BP: 0, BC: 0 }; played().forEach(m => { r.J++; r[result(m)]++; r.BP += +m.butsPour; r.BC += +m.butsContre; }); r.pts = r.V * 3 + r.N; return r; }
function goalsBy() { const g = {}; played().forEach(m => (m.buteurs || []).forEach(b => { if (b.playerId) g[b.playerId] = (g[b.playerId] || 0) + (+b.buts || 0); })); return g; }
function matchesPlayedBy() { const g = {}; played().forEach(m => new Set([...(m.convoques || []), ...(m.buteurs || []).map(b => b.playerId)].filter(Boolean)).forEach(id => g[id] = (g[id] || 0) + 1)); return g; }
function presence() { const t = S.trainings.filter(x => x.date <= today() && (x.presents || []).length); const g = {}; t.forEach(x => (x.presents || []).forEach(id => g[id] = (g[id] || 0) + 1)); return { total: t.length, by: g, list: t }; }
function caisse() { let rec = 0, dep = 0; S.finances.forEach(f => { if (f.type === "recette") rec += +f.montant || 0; else dep += +f.montant || 0; }); return { rec, dep, solde: rec - dep }; }
const sortedMatches = () => [...S.matches].sort((a, b) => (a.date + (a.heure || "")).localeCompare(b.date + (b.heure || "")));
const upcomingMatches = () => sortedMatches().filter(m => !isPlayed(m) && m.date >= today());
const upcomingTrainings = () => [...S.trainings].filter(t => t.date >= today()).sort((a, b) => (a.date + (a.heure || "")).localeCompare(b.date + (b.heure || "")));
/* Demandes */
const decisionOf = id => S.decisions.find(d => d.id === id);
const statusOf = id => (decisionOf(id) || {}).statut || "En attente";
function allDemandes() {
  const out = [];
  S.comptes.forEach(c => (c.demandes || []).forEach(d => out.push({ ...d, compteId: c.id, playerId: c.playerId })));
  return out.sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
}
const pendingCount = () => allDemandes().filter(d => statusOf(d.id) === "En attente").length;
const stTagReq = s => `<span class="tag ${({ "Acceptée": "t-green", "Refusée": "t-red", "En attente": "t-gold" })[s]}">${esc(s)}</span>`;
const reqWhen = d => d.dateFin && d.dateFin !== d.date ? `du ${fmtDate(d.date)} au ${fmtDate(d.dateFin)}` : fmtDate(d.date);
const reqEvent = d => { if (d.eventId) { const m = S.matches.find(x => x.id === d.eventId); if (m) return "Match vs " + m.adversaire; const t = S.trainings.find(x => x.id === d.eventId); if (t) return "Entraînement" + (t.theme ? " – " + t.theme : ""); } return d.type; };

/* ================= Navigation ================= */

const head = (title, sub, btn) => `<div class="top"><div><h1>${title}</h1><p>${sub}</p></div>${btn && canWrite && isAdminView() ? btn : ""}</div>`;

/* ================= Notifications ================= */
const seenKey = () => "afm_seen_" + (MY_ID || "x") + (isAdminView() ? "_a" : "_j");
const lastSeen = () => lsGet(seenKey(), "1970");
function notifItems() {
  const items = [];
  S.annonces.forEach(a => items.push({ ts: a.date || "", ic: "mega", cls: a.priorite === "Urgent" ? "t-red" : a.priorite === "Important" ? "t-gold" : "t-pri", title: a.titre, sub: "Annonce · " + (a.priorite || "Info"), href: "#annonces" }));

/* ================= Entraînements ================= */

function saveSettingsForm(f) { const d = Object.fromEntries(new FormData(f)); d.cotisation = +d.cotisation || 0; saveSettings(d); toast("Paramètres enregistrés"); }
function usersTable() {

const suggestLogin = p => (p.prenom + "." + p.nom).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9.]/g, "").slice(0, 32);
const randomPass = () => { const c = "abcdefghjkmnpqrstuvwxyz23456789"; let s = ""; const a = new Uint32Array(8); crypto.getRandomValues(a); a.forEach(x => s += c[x % c.length]); return s; };
function openUserForm(id, playerId) {
  const u = id ? S.users.find(x => x.id === id) : null; const p = playerId ? pById(playerId) : null;
  const linkedIds = new Set(S.users.filter(x => x.role === "joueur" && x.id !== id).map(x => x.playerId));
  const free = [...S.players].filter(x => !linkedIds.has(x.id)).sort((a, b) => a.nom.localeCompare(b.nom));

    <label id="pidL" style="${role === "joueur" ? "" : "display:none"}">Fiche joueur<select class="input" name="playerId" onchange="if(!this.form.username.disabled&&!this.form.username.value){const p=S.players.find(x=>x.id===this.value);if(p)this.form.username.value=suggestLogin(p)}"><option value="">— Choisir —</option>${free.map(x => `<option value="${x.id}" ${x.id === pid ? "selected" : ""}>${esc(x.prenom)} ${esc(x.nom)}</option>`).join("")}</select></label>
    <label>Identifiant *<input class="input" name="username" required value="${esc(u ? u.username : p ? suggestLogin(p) : "")}" ${u ? "disabled" : ""} pattern="[a-z0-9._-]{3,32}" title="3 à 32 caractères : lettres minuscules, chiffres, . _ -"></label>
    <label>Nom affiché<input class="input" name="nom" value="${esc(u ? u.nom : p ? p.prenom + " " + p.nom : "")}"></label>

    <p class="full muted" style="margin:0;font-size:12.5px">Notez le mot de passe avant d'enregistrer : il ne pourra plus être affiché ensuite.</p>
  </div><footer><button type="button" class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn">Enregistrer</button></footer></form>`;
  $("#ov").classList.add("open");
}
async function submitUser(f, id) {
  const d = { role: f.role.value, playerId: f.role.value === "joueur" ? f.playerId.value : "", nom: f.nom.value.trim() };
  if (f.password.value) d.password = f.password.value;
  if (!id) d.username = f.username.value.trim().toLowerCase();
  const login = d.username || (S.users.find(u => u.id === id) || {}).username, pw = d.password;
  try {
    if (id) await api("PUT", "users/" + id, d); else await api("POST", "users", d);
    await refresh();
    if (pw) showCredentials(login, pw); else { closeModal(); toast("Compte mis à jour"); }
  } catch (e) { apiErr(e); }
}
function showCredentials(login, pw) {
  const txt = `Espace AFM\nAdresse : ${location.origin}\nIdentifiant : ${login}\nMot de passe : ${pw}`;
  window._cred = txt;
  $("#modal").innerHTML = `<header><h2>Identifiants à transmettre</h2><button class="icon-btn" onclick="closeModal()">${I.x}</button></header>
  <div class="body"><div class="full reason" style="white-space:pre-wrap;font-family:ui-monospace,monospace;background:#f6f7fb;border-radius:8px;padding:12px">${esc(txt)}</div>
  <p class="full muted" style="margin:0;font-size:12.5px">Envoyez ces informations au joueur (WhatsApp, SMS…). Il pourra changer son mot de passe en cliquant sur son nom en haut de l'écran.</p></div>
  <footer><button class="btn ghost" onclick="navigator.clipboard.writeText(window._cred).then(()=>toast('Copié'),()=>toast('Copie impossible'))">Copier</button><button class="btn" onclick="closeModal()">Terminé</button></footer>`;
  $("#ov").classList.add("open");
}
function askDeleteUser(id) {
  const u = S.users.find(x => x.id === id); if (!u) return;
  $("#modal").innerHTML = `<header><h2>Supprimer le compte « ${esc(u.username)} » ?</h2><button class="icon-btn" onclick="closeModal()">${I.x}</button></header>
  <div class="body"><p class="full" style="margin:0">La personne ne pourra plus se connecter. Ses demandes d'absence déjà envoyées sont conservées.</p></div>

async function deleteUser(id) { try { await api("DELETE", "users/" + id); closeModal(); toast("Compte supprimé"); refresh(); } catch (e) { apiErr(e); } }
function openMyAccount() {

async function changePass(f) {

      field("Message *", `<textarea class="input" name="message" rows="6" required>${esc(a.message || "")}</textarea>`, true);
  }
  $("#modal").innerHTML = `<form onsubmit="event.preventDefault();submitForm(this)"><header><h2>${title}</h2><button type="button" class="icon-btn" onclick="closeModal()">${I.x}</button></header>
    <div class="body">${body}</div><footer><button type="button" class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn">${col === "annonces" && !it ? "Publier" : "Enregistrer"}</button></footer></form>`;
  $("#ov").classList.add("open");
  setTimeout(() => { const f = $("#modal input:not([type=checkbox])"); if (f) f.focus(); }, 30);
}
function scorerRow(b = {}) { return `<div class="scorer-row"><select class="input" name="sc_p">${playerOpts(b.playerId)}</select><input class="input" type="number" min="1" name="sc_n" value="${esc(b.buts || 1)}" title="Nombre de buts"><button type="button" class="icon-btn" onclick="this.parentElement.remove()">${I.x}</button></div>`; }
function addScorer() { $("#scorers").insertAdjacentHTML("beforeend", scorerRow()); }
function syncCats(t) { $("#catSel").innerHTML = opt(t === "recette" ? CAT_R : CAT_D); }
function closeModal() { $("#ov").classList.remove("open"); FORM = null; }
$("#ov").addEventListener("mousedown", e => { if (e.target.id === "ov") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeModal(); closeNotif(); } });

function submitForm(f) {
  const fd = new FormData(f), d = {};
  for (const [k, v] of fd.entries()) if (!["convoques", "presents", "sc_p", "sc_n"].includes(k)) d[k] = typeof v === "string" ? v.trim() : v;
  const { col, id } = FORM; const prev = id ? S[col].find(x => x.id === id) : {};
  const obj = { ...prev, ...d, id: id || uid(), updatedAt: nowIso() };
  if (!id) obj.createdAt = obj.updatedAt;
  if (col === "matches") {
    obj.convoques = fd.getAll("convoques");
    const ps = fd.getAll("sc_p"), ns = fd.getAll("sc_n");
    obj.buteurs = ps.map((p, i) => ({ playerId: p, buts: +ns[i] || 1 })).filter(x => x.playerId);
    if ((obj.butsPour === "") !== (obj.butsContre === "")) { toast("Renseignez les deux scores (ou aucun)"); return; }
  }
  if (col === "trainings") obj.presents = fd.getAll("presents");
  if (col === "finances") obj.montant = +obj.montant || 0;
  if (col === "annonces" && !id) obj.date = obj.createdAt;
  saveItem(col, obj); closeModal(); toast(col === "annonces" && !id ? "Annonce publiée" : "Enregistré");
}
function askDelete(col, id) {
  const lab = { players: "ce joueur", matches: "ce match", trainings: "cette séance", finances: "cette opération", annonces: "cette annonce" }[col];
  $("#modal").innerHTML = `<header><h2>Supprimer ${lab} ?</h2><button class="icon-btn" onclick="closeModal()">${I.x}</button></header>
  <div class="body"><p class="full" style="margin:0">Cette action est définitive.</p></div>
  <footer><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn danger" onclick="removeItem('${col}','${id}');closeModal();toast('Supprimé')">Supprimer</button></footer>`;
  $("#ov").classList.add("open");
}

/* ================= Démarrage ================= */
initStore();
</script>
</body>
</html>
